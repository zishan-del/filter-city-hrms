name: Fix employee leave and attendance
on:
  push:
    branches: [fix/employee-actions]
    paths:
      - 'api/hrms.js'
      - '.github/workflows/diagnose-employee-actions.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add employee ID to employee auth token
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/hrms.js')
          s=p.read_text()
          old="""    id: user.id,\n    role: user.role,\n    exp: Date.now() + 24 * 60 * 60 * 1000"""
          new="""    id: user.id,\n    role: user.role,\n    employee_id: user.employee_id || null,\n    exp: Date.now() + 24 * 60 * 60 * 1000"""
          if old not in s:
              raise SystemExit('Expected token block not found; no changes made')
          if new not in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/hrms.js
          git commit -m 'Fix employee attendance and leave authentication' || true
          git push
