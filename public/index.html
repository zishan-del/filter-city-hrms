<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FILTER CITY HRMS</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:32px;border-radius:16px;box-shadow:0 8px 30px #0001;width:min(380px,calc(100% - 40px))}h1{margin:0 0 8px}.muted{color:#667085;margin-bottom:24px}input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:9px;border:1px solid #d0d5dd}button{background:#111827;color:white;border:0;font-weight:700;cursor:pointer}.err{color:#b42318;min-height:22px}.ok{color:#027a48}</style></head><body><div class="card"><h1>FILTER CITY HRMS</h1><div class="muted">Secure cloud-based Human Resources Management</div><form id="f"><input id="u" value="admin@company.com" placeholder="Username" autocomplete="username"><input id="p" type="password" value="Admin@12345" placeholder="Password" autocomplete="current-password"><button>Sign in</button><div id="m" class="err"></div></form><div id="app" hidden><h2>Dashboard</h2><p class="ok">Cloud connection is working.</p><p id="info"></p></div></div><script>const f=document.getElementById('f'),m=document.getElementById('m');f.onsubmit=async e=>{e.preventDefault();m.textContent='Signing in...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value,role:'ADMIN'})});const x=await r.json();if(!r.ok)throw Error(x.error||'Login failed');const d=await fetch('/api/data',{headers:{Authorization:'Bearer '+x.token}});const data=await d.json();if(!d.ok)throw Error(data.error||'Cloud data failed');f.hidden=true;app.hidden=false;info.textContent=`Cloud connected. Employees: ${data.employees.length}.`;localStorage.clear();}catch(e){m.textContent=e.message}};</script></body></html>
