name: Build leave cycle and password preview
on:
  push:
    branches: [feature/leave-cycle-password]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/leave-cycle-password
      - name: Add leave tracker and password UI patch
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          if 'Leave cycle (years)' not in s:
              feature=r'''
          <script>
          function employeeForm(e={}){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><b>${e.id?'Edit':'Add'} Employee</b><button class="secondary" onclick="render('Employees')">Back</button></div><div class="form-grid"><input type="hidden" id="eid" value="${e.id||''}"><div class="field"><label>Employee ID</label><input id="employee_id" value="${esc(e.employee_id||'')}" ${e.id?'readonly':''} required></div><div class="field"><label>Full name</label><input id="full_name" value="${esc(e.full_name||'')}" required></div><div class="field"><label>Mobile</label><input id="mobile" value="${esc(e.mobile||'')}"></div><div class="field"><label>Saudi National ID / Iqama</label><input id="national_id" value="${esc(e.national_id||'')}"></div><div class="field"><label>Nationality</label><input id="nationality" value="${esc(e.nationality||'Saudi')}"></div><div class="field"><label>Joining date</label><input id="joining_date" type="date" value="${esc(String(e.joining_date||'').slice(0,10))}"></div><div class="field"><label>Department</label><input id="department" value="${esc(e.department||'')}"></div><div class="field"><label>Job title</label><input id="job_title" value="${esc(e.job_title||'')}"></div><div class="field"><label>Salary</label><input id="salary" type="number" step="0.01" value="${e.salary||0}"></div><div class="field"><label>Bank/payment details</label><input id="bank_details" value="${esc(e.bank_details||'')}"></div><div class="field"><label>Status</label><select id="status"><option ${e.status==='Active'?'selected':''}>Active</option><option ${e.status==='Inactive'?'selected':''}>Inactive</option></select></div><div class="field"><label>Leave cycle (years)</label><input id="leave_cycle_years" type="number" min="1" step="0.5" value="${e.leave_cycle_years||2}"></div><div class="field"><label>Last leave end date</label><input id="last_leave_end_date" type="date" value="${esc(String(e.last_leave_end_date||'').slice(0,10))}"></div><div class="field"><label>Next leave date</label><input id="next_leave_date" type="date" value="${esc(String(e.next_leave_date||'').slice(0,10))}"></div><div class="field"><label>Planned leave days (30–60)</label><input id="planned_leave_days" type="number" min="30" max="60" step="1" value="${e.planned_leave_days||30}"></div><div class="field"><label>Login username</label><input id="emp_username" value="${esc((state.users.find(u=>u.employee_id===e.employee_id)||{}).username||'')}"></div><div class="field"><label>${e.id?'New ':''}password</label><input id="emp_password" type="password" placeholder="${e.id?'Leave blank to keep current':''}"></div><div class="full"><button onclick="saveEmployee()">Save to Cloud</button></div></div></div>`}
          async function saveEmployee(){const id=document.getElementById('eid').value;const body={employee_id:employee_id.value,full_name:full_name.value,mobile:mobile.value,national_id:national_id.value,nationality:nationality.value,joining_date:joining_date.value||null,department:department.value,job_title:job_title.value,salary:salary.value,bank_details:bank_details.value,status:status.value,leave_cycle_years:leave_cycle_years.value,last_leave_end_date:last_leave_end_date.value||null,next_leave_date:next_leave_date.value||null,planned_leave_days:planned_leave_days.value,username:emp_username.value,password:emp_password.value};await api(id?'PUT':'POST',id?`employees/${id}`:'employees',body);toast('Employee saved to cloud');await refresh()}
          function viewLeave(){const me=JSON.parse(sessionStorage.getItem('fc_user'));const rows=role==='EMPLOYEE'?state.leaves.filter(l=>l.employee_id===me.employeeId):state.leaves;const upcoming=role==='ADMIN'?state.employees.filter(e=>e.status==='Active'&&e.next_leave_date).sort((a,b)=>String(a.next_leave_date).localeCompare(String(b.next_leave_date))):[];const tracker=role==='ADMIN'?`<div class="section"><div class="section-head"><b>Upcoming Employee Leave</b><span class="badge">30–60 days every 2 years</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Name</th><th>Next Leave</th><th>Planned Days</th><th>Cycle</th><th>Last Leave End</th><th>Days Until</th></tr></thead><tbody>${upcoming.map(e=>{const d=Math.ceil((new Date(String(e.next_leave_date).slice(0,10)+'T00:00:00')-new Date(new Date().toISOString().slice(0,10)+'T00:00:00'))/86400000);return `<tr><td>${esc(e.employee_id)}</td><td>${esc(e.full_name)}</td><td>${esc(String(e.next_leave_date).slice(0,10))}</td><td>${esc(e.planned_leave_days||30)}</td><td>${esc(e.leave_cycle_years||2)} years</td><td>${esc(String(e.last_leave_end_date||'').slice(0,10)||'—')}</td><td><span class="badge">${d<0?'Overdue':d+' days'}</span></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No upcoming leave dates. Edit an employee to add the next leave date.</td></tr>'}</tbody></table></div></div>`:'';return tracker+`<div class="section"><div class="section-head"><b>Leave Requests</b><button onclick="leaveForm()">+ Leave Request</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Type</th><th>Start</th><th>End</th><th>Days</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(l=>`<tr><td>${esc(l.employee_id)}</td><td>${esc(l.leave_type)}</td><td>${esc(String(l.start_date).slice(0,10))}</td><td>${esc(String(l.end_date).slice(0,10))}</td><td>${esc(l.days)}</td><td>${esc(l.status)}</td><td>${role==='ADMIN'&&l.status==='Pending'?`<button onclick="decideLeave(${l.id},'Approved')">Approve</button> <button class="danger" onclick="decideLeave(${l.id},'Rejected')">Reject</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No leave requests.</td></tr>'}</tbody></table></div></div>`}
          function viewSettings(){if(role!=='ADMIN')return `<div class="section"><div class="empty">Admin only.</div></div>`;return `<div class="section"><div class="section-head"><b>Company Settings</b></div><div class="form-grid"><div class="field"><label>Company</label><input id="set_company" value="${esc(state.settings.company)}"></div><div class="field"><label>Working hours/day</label><input id="set_hours" type="number" step="0.5" value="${state.settings.hours}"></div><div class="field"><label>Annual leave days</label><input id="set_leave" type="number" value="${state.settings.annual_leave_days}"></div><div class="full"><button onclick="saveCompanySettings()">Save Settings to Cloud</button></div></div></div><div class="section"><div class="section-head"><b>Change Admin Password</b></div><div class="form-grid"><div class="field"><label>Current password</label><input id="current_password" type="password" autocomplete="current-password"></div><div class="field"><label>New password</label><input id="new_password" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label>Confirm new password</label><input id="confirm_password" type="password" minlength="8" autocomplete="new-password"></div><div class="full"><button onclick="changeAdminPassword()">Change Password</button></div></div></div>`}
          async function saveCompanySettings(){await api('PUT','settings',{company:set_company.value,hours:set_hours.value,annual_leave_days:set_leave.value});toast('Settings saved to cloud');await refresh()}
          async function changeAdminPassword(){if(new_password.value.length<8)return toast('New password must be at least 8 characters');if(new_password.value!==confirm_password.value)return toast('New passwords do not match');await api('POST','auth/change-password',{current_password:current_password.value,new_password:new_password.value});current_password.value='';new_password.value='';confirm_password.value='';toast('Admin password changed successfully')}
          </script>
          '''
              s=s.replace('</body>',feature+'</body>')
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add leave tracker and admin password UI'
          git push origin feature/leave-cycle-password
