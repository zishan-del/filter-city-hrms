<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FILTER CITY HRMS</title>
<style>
:root{--navy:#0b3158;--blue:#124f87;--teal:#117b78;--bg:#f3f6fa;--line:#dce3eb;--danger:#b42318;--ok:#087443}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#122033}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:#fff}.secondary{background:#e9eef5;color:#17324d}.danger{background:var(--danger)}.success{background:var(--ok)}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#082e56,#087b77)}.login-card{width:min(460px,100%);background:#fff;border-radius:20px;padding:30px;box-shadow:0 20px 60px #0003}.brand{text-align:center}.logo{width:68px;height:68px;border-radius:18px;background:var(--blue);color:white;display:grid;place-items:center;font-size:26px;font-weight:800;margin:auto}.brand h1{font-size:25px;margin:12px 0 4px}.muted{color:#637083}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#edf2f7;border-radius:10px;padding:4px;margin:25px 0 18px}.tabs button{background:transparent;color:#17324d}.tabs button.active{background:#fff;box-shadow:0 2px 8px #0001;font-weight:700}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #c9d2dd;border-radius:8px;background:#fff}.login-btn{width:100%;margin-top:8px}.msg{margin-top:10px;padding:10px;border-radius:8px;background:#fff1f0;color:var(--danger);font-size:14px}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:#092e54;color:#fff;padding:18px;position:sticky;top:0;height:100vh}.side-title{font-size:22px;font-weight:800;margin:3px 0 5px}.side-sub{font-size:12px;color:#b9c9da;margin-bottom:25px}.nav{display:grid;gap:5px}.nav button{text-align:left;background:transparent;color:#fff}.nav button.active,.nav button:hover{background:#214d78}.logout{margin-top:30px;width:100%;background:#8f9db0}.main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 25px;position:sticky;top:0;z-index:3}.top h2{margin:0;font-size:21px}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-weight:800}.content{padding:24px;max-width:1400px;margin:auto}.hero{background:linear-gradient(110deg,#0c4a80,#117d78);color:#fff;border-radius:14px;padding:23px;margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:25px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.stat{font-size:28px;font-weight:800;margin-top:8px}.section{background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:18px;overflow:hidden}.section-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 13px;border-bottom:1px solid #edf0f4;white-space:nowrap;font-size:14px}.table th{background:#f7f9fb;font-size:12px;text-transform:uppercase;color:#516175}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8eef5;font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px}.form-grid .full{grid-column:1/-1}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:30px;text-align:center;color:#66758a}.toast{position:fixed;right:18px;bottom:18px;background:#102a43;color:#fff;padding:12px 16px;border-radius:9px;z-index:10}.mobile-menu{display:none}
@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:-250px;width:230px;z-index:8;transition:.2s}.sidebar.open{left:0}.mobile-menu{display:block;background:transparent;color:#123;font-size:22px;padding:4px}.top{padding:0 12px}.content{padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}
@media(max-width:500px){.cards{grid-template-columns:1fr}.top h2{font-size:18px}.user .who{display:none}}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-card"><div class="brand"><div class="logo">FC</div><h1>FILTER CITY HRMS</h1><div class="muted">Human Resources Management System</div></div><div class="tabs"><button id="adminTab" class="active" onclick="setRole('ADMIN')">Admin Login</button><button id="empTab" onclick="setRole('EMPLOYEE')">Employee Login</button></div><form onsubmit="login(event)"><div class="field"><label>Username / Email</label><input id="username" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="login-btn" type="submit">Login</button><div id="loginMsg" class="msg hidden"></div></form><div id="demo" class="muted" style="text-align:center;font-size:12px;margin-top:12px">Default admin: admin@company.com / Admin@12345</div></div></div>
<div id="app" class="shell hidden"><aside id="sidebar" class="sidebar"><div class="side-title">FILTER CITY</div><div class="side-sub">Human Resources Management</div><div class="nav" id="nav"></div><button class="logout" onclick="logout()">Logout</button></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:8px"><button class="mobile-menu" onclick="toggleMenu()">☰</button><h2 id="pageTitle">Dashboard</h2></div><div class="user"><div class="avatar" id="avatar">A</div><div class="who"><b id="who">admin@company.com</b><div class="muted" id="roleText">ADMIN</div></div></div></header><div class="content" id="content"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const API='/api'; let role='ADMIN', state=null, current='Dashboard';
const navItems=[['Dashboard','dashboard'],['Employees','employees'],['Attendance','attendance'],['Tasks','tasks'],['Leave','leave'],['Holidays','holidays'],['Payroll','payroll'],['EOSB','eosb'],['Reports','reports'],['Settings','settings']];
const tokenKey='fc_hrms_token';
function setRole(r){role=r;document.getElementById('adminTab').classList.toggle('active',r==='ADMIN');document.getElementById('empTab').classList.toggle('active',r==='EMPLOYEE');document.getElementById('demo').textContent=r==='ADMIN'?'Default admin: admin@company.com / Admin@12345':'Employee credentials are created by Admin.'}
async function login(e){e.preventDefault();hideMsg();try{const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value,role})});const text=await r.text();let d={};try{d=JSON.parse(text)}catch(_){throw Error(text||'Login failed')};if(!r.ok)throw Error(d.error||'Login failed');localStorage.setItem(tokenKey,d.token);sessionStorage.setItem('fc_user',JSON.stringify(d.user));await boot(d.user)}catch(err){showMsg(err.message)}}
async function boot(user){try{const r=await fetch(API+'/data',{headers:{Authorization:'Bearer '+localStorage.getItem(tokenKey)}});const text=await r.text();let d={};try{d=JSON.parse(text)}catch(_){throw Error(text||'Cloud data unavailable')};if(!r.ok)throw Error(d.error||'Cloud data unavailable');state=d;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=user.username;document.getElementById('roleText').textContent=user.role;document.getElementById('avatar').textContent=(user.username||'U')[0].toUpperCase();buildNav(user.role);render('Dashboard')}catch(e){localStorage.removeItem(tokenKey);showMsg(e.message)}}
function buildNav(r){document.getElementById('nav').innerHTML=navItems.filter(x=>r==='ADMIN'||['Dashboard','Attendance','Tasks','Leave'].includes(x[0])).map(x=>`<button id="nav-${x[1]}" onclick="render('${x[0]}')">${x[0]}</button>`).join('')}
async function refresh(){const r=await fetch(API+'/data',{headers:{Authorization:'Bearer '+localStorage.getItem(tokenKey)}});if(r.status===401)return logout();const text=await r.text();let d={};try{d=JSON.parse(text)}catch(_){throw Error(text||'Cloud data unavailable')};if(!r.ok)throw Error(d.error||'Cloud data unavailable');state=d;render(current)}
function render(page){closeMenu();current=page;document.getElementById('pageTitle').textContent=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));const key=page.toLowerCase();document.getElementById('nav-'+key)?.classList.add('active');const views={Dashboard:viewDashboard,Employees:viewEmployees,Attendance:viewAttendance,Tasks:viewTasks,Leave:viewLeave,Holidays:viewHolidays,Payroll:viewPayroll,EOSB:viewEOSB,Reports:viewReports,Settings:viewSettings};document.getElementById('content').innerHTML=views[page]?views[page]():''}
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function viewDashboard(){const e=state.employees.length,p=state.attendance.filter(a=>String(a.work_date).slice(0,10)===new Date().toISOString().slice(0,10)).length,t=state.tasks.filter(x=>x.status!=='Completed').length,l=state.leaves.filter(x=>x.status==='Pending').length;return `<div class="hero"><h1>Welcome, ${esc(JSON.parse(sessionStorage.getItem('fc_user')).username)}</h1><div>All information below is loaded from the cloud database.</div></div><div class="cards"><div class="card">Total Employees<div class="stat">${e}</div></div><div class="card">Present Today<div class="stat">${p}</div></div><div class="card">Pending Tasks<div class="stat">${t}</div></div><div class="card">Pending Leave<div class="stat">${l}</div></div></div><div class="section"><div class="section-head"><b>Cloud connection</b><span class="badge">● Connected to PostgreSQL</span></div><div style="padding:18px">PC and mobile use the same API and database. Browser local storage is used only for the login token, never for HRMS records.</div></div>`}
function viewEmployees(){if(role!=='ADMIN')return `<div class="section"><div class="empty">Employee management is available to Admin.</div></div>`;return `<div class="section"><div class="section-head"><b>Employees</b><button onclick="employeeForm()">+ Add Employee</button></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Job</th><th>Salary</th><th>Status</th><th>Login</th><th></th></tr></thead><tbody>${state.employees.map(e=>`<tr><td>${esc(e.employee_id)}</td><td>${esc(e.full_name)}</td><td>${esc(e.department)}</td><td>${esc(e.job_title)}</td><td>${Number(e.salary||0).toFixed(2)}</td><td><span class="badge">${esc(e.status)}</span></td><td>${esc((state.users.find(u=>u.employee_id===e.employee_id)||{}).username||'—')}</td><td><div class="actions"><button onclick='employeeForm(${JSON.stringify(e)})'>Edit</button><button class="danger" onclick="deleteEmployee(${e.id})">Delete</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
function employeeForm(e={}){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><b>${e.id?'Edit':'Add'} Employee</b><button class="secondary" onclick="render('Employees')">Back</button></div><div class="form-grid"><input type="hidden" id="eid" value="${e.id||''}"><div class="field"><label>Employee ID</label><input id="employee_id" value="${esc(e.employee_id||'')}" ${e.id?'readonly':''} required></div><div class="field"><label>Full name</label><input id="full_name" value="${esc(e.full_name||'')}" required></div><div class="field"><label>Mobile</label><input id="mobile" value="${esc(e.mobile||'')}"></div><div class="field"><label>Saudi National ID / Iqama</label><input id="national_id" value="${esc(e.national_id||'')}"></div><div class="field"><label>Nationality</label><input id="nationality" value="${esc(e.nationality||'Saudi')}"></div><div class="field"><label>Joining date</label><input id="joining_date" type="date" value="${esc(String(e.joining_date||'').slice(0,10))}"></div><div class="field"><label>Department</label><input id="department" value="${esc(e.department||'')}"></div><div class="field"><label>Job title</label><input id="job_title" value="${esc(e.job_title||'')}"></div><div class="field"><label>Basic salary</label><input id="salary" type="number" step="0.01" value="${e.salary||0}"></div><div class="field"><label>Housing allowance</label><input id="housing_allowance" type="number" step="0.01" value="${e.housing_allowance||0}"></div><div class="field"><label>Transport allowance</label><input id="transport_allowance" type="number" step="0.01" value="${e.transport_allowance||0}"></div><div class="field"><label>Other fixed allowance</label><input id="other_allowance" type="number" step="0.01" value="${e.other_allowance||0}"></div><div class="field"><label>Bank/payment details</label><input id="bank_details" value="${esc(e.bank_details||'')}"></div><div class="field"><label>Status</label><select id="status"><option ${e.status==='Active'?'selected':''}>Active</option><option ${e.status==='Inactive'?'selected':''}>Inactive</option></select></div><div class="field"><label>Leave cycle (years)</label><input id="leave_cycle_years" type="number" min="1" step="0.5" value="${e.leave_cycle_years||2}"></div><div class="field"><label>Last leave end date</label><input id="last_leave_end_date" type="date" value="${esc(String(e.last_leave_end_date||'').slice(0,10))}"></div><div class="field"><label>Next leave date</label><input id="next_leave_date" type="date" value="${esc(String(e.next_leave_date||'').slice(0,10))}"></div><div class="field"><label>Planned leave days (30–60)</label><input id="planned_leave_days" type="number" min="30" max="60" step="1" value="${e.planned_leave_days||30}"></div><div class="field"><label>Login username</label><input id="emp_username" value="${esc((state.users.find(u=>u.employee_id===e.employee_id)||{}).username||'')}"></div><div class="field"><label>${e.id?'New ':''}password</label><input id="emp_password" type="password" placeholder="${e.id?'Leave blank to keep current':''}"></div><div class="full"><button onclick="saveEmployee()">Save to Cloud</button></div></div></div>`}
async function saveEmployee(){const id=document.getElementById('eid').value;const body={employee_id:employee_id.value,full_name:full_name.value,mobile:mobile.value,national_id:national_id.value,nationality:nationality.value,joining_date:joining_date.value||null,department:department.value,job_title:job_title.value,salary:salary.value,housing_allowance:housing_allowance.value,transport_allowance:transport_allowance.value,other_allowance:other_allowance.value,bank_details:bank_details.value,status:status.value,leave_cycle_years:leave_cycle_years.value,last_leave_end_date:last_leave_end_date.value||null,next_leave_date:next_leave_date.value||null,planned_leave_days:planned_leave_days.value,username:emp_username.value,password:emp_password.value};await api(id?'PUT':'POST',id?`employees/${id}`:'employees',body);toast('Employee saved to cloud');await refresh()}
function viewAttendance(){const me=JSON.parse(sessionStorage.getItem('fc_user'));const rows=role==='EMPLOYEE'?state.attendance.filter(a=>a.employee_id===me.employeeId):state.attendance;return `<div class="section"><div class="section-head"><b>Attendance</b>${role==='EMPLOYEE'?'<div class="actions"><button onclick="checkAttendance(\'checkin\')">Check In</button><button class="secondary" onclick="checkAttendance(\'checkout\')">Check Out</button></div>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Date</th><th>Check In</th><th>Check Out</th><th>GPS</th><th>Status</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${esc(a.employee_id)}</td><td>${esc(String(a.work_date).slice(0,10))}</td><td>${esc(a.check_in||'—')}</td><td>${esc(a.check_out||'—')}</td><td>${a.latitude?esc(a.latitude)+', '+esc(a.longitude):'—'}</td><td>${esc(a.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No attendance records.</td></tr>'}</tbody></table></div></div>`}
async function checkAttendance(action){const send=async(lat=null,lon=null)=>{await api('POST','attendance',{action,latitude:lat,longitude:lon});toast(action==='checkin'?'Checked in to cloud':'Checked out in cloud');await refresh()};if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>send(p.coords.latitude,p.coords.longitude),()=>send())}else send()}
function viewTasks(){const me=JSON.parse(sessionStorage.getItem('fc_user'));const rows=role==='EMPLOYEE'?state.tasks.filter(t=>t.employee_id===me.employeeId):state.tasks;return `<div class="section"><div class="section-head"><b>Tasks</b>${role==='ADMIN'?'<button onclick="taskForm()">+ Assign Task</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Title</th><th>Date</th><th>Deadline</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(t.employee_id)}</td><td>${esc(t.title)}</td><td>${esc(String(t.task_date||'').slice(0,10))}</td><td>${esc(t.deadline_time||'—')}</td><td>${esc(t.priority)}</td><td>${esc(t.status)}</td><td>${role==='EMPLOYEE'&&t.status!=='Completed'?`<button onclick="updateTask(${t.id},'${t.status==='Pending'?'In Progress':'Completed'}')">${t.status==='Pending'?'Start':'Complete'}</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No tasks.</td></tr>'}</tbody></table></div></div>`}
function taskForm(){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><b>Assign Task</b><button class="secondary" onclick="render('Tasks')">Back</button></div><div class="form-grid"><div class="field"><label>Employee</label><select id="task_emp">${state.employees.filter(e=>e.status==='Active').map(e=>`<option value="${esc(e.employee_id)}">${esc(e.employee_id)} — ${esc(e.full_name)}</option>`).join('')}</select></div><div class="field"><label>Title</label><input id="task_title" required></div><div class="field"><label>Priority</label><select id="task_priority"><option>Low</option><option selected>Normal</option><option>High</option></select></div><div class="field"><label>Date</label><input id="task_date" type="date"></div><div class="field"><label>Start time</label><input id="task_start" type="time"></div><div class="field"><label>Deadline</label><input id="task_deadline" type="time"></div><div class="field full"><label>Description</label><textarea id="task_desc"></textarea></div><div class="full"><button onclick="saveTask()">Assign to Cloud</button></div></div></div>`}
async function saveTask(){await api('POST','tasks',{employee_id:task_emp.value,title:task_title.value,priority:task_priority.value,task_date:task_date.value||null,start_time:task_start.value||null,deadline_time:task_deadline.value||null,description:task_desc.value});toast('Task assigned');await refresh()}
async function updateTask(id,status){await api('PUT','tasks/'+id,{status});toast('Task status updated');await refresh()}
function viewLeave(){const me=JSON.parse(sessionStorage.getItem('fc_user'));const rows=role==='EMPLOYEE'?state.leaves.filter(l=>l.employee_id===me.employeeId):state.leaves;const upcoming=role==='ADMIN'?state.employees.filter(e=>e.status==='Active'&&e.next_leave_date).sort((a,b)=>String(a.next_leave_date).localeCompare(String(b.next_leave_date))):[];const tracker=role==='ADMIN'?`<div class="section"><div class="section-head"><b>Upcoming Employee Leave</b><span class="badge">30–60 days every 2 years</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Name</th><th>Next Leave</th><th>Planned Days</th><th>Cycle</th><th>Last Leave End</th><th>Days Until</th></tr></thead><tbody>${upcoming.map(e=>{const d=Math.ceil((new Date(String(e.next_leave_date).slice(0,10)+'T00:00:00')-new Date(new Date().toISOString().slice(0,10)+'T00:00:00'))/86400000);return `<tr><td>${esc(e.employee_id)}</td><td>${esc(e.full_name)}</td><td>${esc(String(e.next_leave_date).slice(0,10))}</td><td>${esc(e.planned_leave_days||30)}</td><td>${esc(e.leave_cycle_years||2)} years</td><td>${esc(String(e.last_leave_end_date||'').slice(0,10)||'—')}</td><td><span class="badge">${d<0?'Overdue':d+' days'}</span></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No upcoming leave dates. Edit an employee to add the next leave date.</td></tr>'}</tbody></table></div></div>`:'';return tracker+`<div class="section"><div class="section-head"><b>Leave Requests</b><button onclick="leaveForm()">+ Leave Request</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Type</th><th>Start</th><th>End</th><th>Days</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(l=>`<tr><td>${esc(l.employee_id)}</td><td>${esc(l.leave_type)}</td><td>${esc(String(l.start_date).slice(0,10))}</td><td>${esc(String(l.end_date).slice(0,10))}</td><td>${esc(l.days)}</td><td>${esc(l.status)}</td><td>${role==='ADMIN'&&l.status==='Pending'?`<button onclick="decideLeave(${l.id},'Approved')">Approve</button> <button class="danger" onclick="decideLeave(${l.id},'Rejected')">Reject</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No leave requests.</td></tr>'}</tbody></table></div></div>`}
function leaveForm(){const opts=role==='EMPLOYEE'?`<input type="hidden" id="leave_emp" value="${esc(JSON.parse(sessionStorage.getItem('fc_user')).employeeId)}">`:`<div class="field"><label>Employee</label><select id="leave_emp">${state.employees.map(e=>`<option>${esc(e.employee_id)}</option>`).join('')}</select></div>`;document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><b>Leave Request</b><button class="secondary" onclick="render('Leave')">Back</button></div><div class="form-grid">${opts}<div class="field"><label>Leave type</label><select id="leave_type"><option>Annual Leave</option><option>Sick Leave</option><option>Emergency Leave</option></select></div><div class="field"><label>Start date</label><input id="leave_start" type="date"></div><div class="field"><label>End date</label><input id="leave_end" type="date"></div><div class="field"><label>Days</label><input id="leave_days" type="number" step="0.5" value="1"></div><div class="field full"><label>Reason</label><textarea id="leave_reason"></textarea></div><div class="full"><button onclick="saveLeave()">Submit to Cloud</button></div></div></div>`}
async function saveLeave(){await api('POST','leaves',{employee_id:leave_emp.value,leave_type:leave_type.value,start_date:leave_start.value,end_date:leave_end.value,days:leave_days.value,reason:leave_reason.value});toast('Leave request saved');await refresh()}
async function decideLeave(id,status){await api('PUT','leaves/'+id,{status});toast('Leave '+status);await refresh()}
function viewHolidays(){if(role!=='ADMIN')return `<div class="section"><div class="empty">Admin only.</div></div>`;return `<div class="section"><div class="section-head"><b>Holidays</b><button onclick="holidayForm()">+ Add Holiday</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Name</th><th>Type</th><th></th></tr></thead><tbody>${state.holidays.map(h=>`<tr><td>${esc(String(h.holiday_date).slice(0,10))}</td><td>${esc(h.name)}</td><td>${esc(h.type)}</td><td><button class="danger" onclick="deleteHoliday(${h.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No holidays.</td></tr>'}</tbody></table></div></div>`}
function holidayForm(){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><b>Add Holiday</b></div><div class="form-grid"><div class="field"><label>Date</label><input id="hol_date" type="date"></div><div class="field"><label>Name</label><input id="hol_name"></div><div class="field"><label>Type</label><select id="hol_type"><option>Saudi Public</option><option>Company</option></select></div><div class="full"><button onclick="saveHoliday()">Save to Cloud</button></div></div></div>`}
async function saveHoliday(){await api('POST','holidays',{holiday_date:hol_date.value,name:hol_name.value,type:hol_type.value});toast('Holiday saved');await refresh()}
async function deleteHoliday(id){await api('DELETE','holidays/'+id);toast('Holiday deleted');await refresh()}
function viewPayroll(){if(role!=='ADMIN')return `<div class="section"><div class="empty">Admin only.</div></div>`;return `<div class="section"><div class="section-head"><b>Payroll</b><span class="badge">Automatic monthly payroll</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Month</th><th>Basic</th><th>Allowances</th><th>Deductions</th><th>Net</th><th></th></tr></thead><tbody>${state.payroll.map(p=>`<tr><td>${esc(p.employee_id)}</td><td>${esc(p.pay_month)}</td><td>${Number(p.basic_salary||0).toFixed(2)}</td><td>${Number(p.allowances||0).toFixed(2)}</td><td>${Number(p.deductions||0).toFixed(2)}</td><td>${Number(p.net_salary||0).toFixed(2)}</td><td><button onclick='payrollForm(${JSON.stringify(p)})'>Edit</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No payroll records.</td></tr>'}</tbody></table></div></div>`}
function payrollForm(p={}){const emp=state.employees.find(e=>e.employee_id===p.employee_id)||{};const basic=p.id?p.basic_salary:(emp.salary||0);const allowances=p.id?p.allowances:(Number(emp.housing_allowance||0)+Number(emp.transport_allowance||0)+Number(emp.other_allowance||0));document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><b>${p.id?'Edit':'Add'} Payroll</b><button class="secondary" onclick="render('Payroll')">Back</button></div><div class="form-grid">${p.id?`<input type="hidden" id="pay_id" value="${p.id}">`:''}<div class="field"><label>Employee</label><select id="pay_emp" ${p.id?'disabled':''}>${state.employees.filter(e=>e.status==='Active').map(e=>`<option value="${esc(e.employee_id)}" ${e.employee_id===p.employee_id?'selected':''}>${esc(e.employee_id)} — ${esc(e.full_name)}</option>`).join('')}</select></div><div class="field"><label>Pay month</label><input id="pay_month" type="month" value="${esc(p.pay_month||new Date().toISOString().slice(0,7))}" ${p.id?'readonly':''}></div><div class="field"><label>Basic salary</label><input id="pay_basic" type="number" step="0.01" value="${basic}"></div><div class="field"><label>Total fixed allowances</label><input id="pay_allow" type="number" step="0.01" value="${allowances}"></div><div class="field"><label>Deductions</label><input id="pay_ded" type="number" step="0.01" value="${p.deductions||0}"></div><div class="full"><div class="card">Net salary: <b id="pay_net">${(Number(basic)+Number(allowances)-Number(p.deductions||0)).toFixed(2)}</b></div></div><div class="full"><button onclick="savePayroll()">Save to Cloud</button></div></div></div>`;['pay_basic','pay_allow','pay_ded'].forEach(id=>document.getElementById(id)?.addEventListener('input',()=>{document.getElementById('pay_net').textContent=(Number(pay_basic.value||0)+Number(pay_allow.value||0)-Number(pay_ded.value||0)).toFixed(2)}))}
async function savePayroll(){const id=document.getElementById('pay_id')?.value;const body={employee_id:pay_emp.value,pay_month:pay_month.value,basic_salary:pay_basic.value,allowances:pay_allow.value,deductions:pay_ded.value};await api(id?'PUT':'POST',id?`payroll/${id}`:'payroll',body);toast('Payroll saved to cloud');await refresh()}
function viewEOSB(){if(role!=='ADMIN')return `<div class="section"><div class="empty">Admin only.</div></div>`;return `<div class="section"><div class="section-head"><b>End of Service Benefit</b><button onclick="eosbForm()">+ Calculate EOSB</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Years</th><th>Last Salary</th><th>Benefit</th></tr></thead><tbody>${state.eosb.map(x=>`<tr><td>${esc(x.employee_id)}</td><td>${esc(x.service_years)}</td><td>${Number(x.last_salary).toFixed(2)}</td><td>${Number(x.benefit).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No EOSB calculations.</td></tr>'}</tbody></table></div></div>`}
function eosbForm(){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><b>Calculate EOSB</b></div><div class="form-grid"><div class="field"><label>Employee</label><select id="eos_emp">${state.employees.map(e=>`<option>${esc(e.employee_id)}</option>`).join('')}</select></div><div class="field"><label>Service years</label><input id="eos_years" type="number" step="0.01"></div><div class="field"><label>Last salary</label><input id="eos_salary" type="number" step="0.01"></div><div class="full"><button onclick="saveEOSB()">Calculate & Save</button></div></div></div>`}
async function saveEOSB(){await api('POST','eosb',{employee_id:eos_emp.value,service_years:eos_years.value,last_salary:eos_salary.value});toast('EOSB saved');await refresh()}
function viewReports(){return `<div class="cards"><div class="card">Employees<div class="stat">${state.employees.length}</div></div><div class="card">Attendance Records<div class="stat">${state.attendance.length}</div></div><div class="card">Tasks<div class="stat">${state.tasks.length}</div></div><div class="card">Leave Requests<div class="stat">${state.leaves.length}</div></div></div><div class="section"><div class="section-head"><b>Report data</b><button onclick="downloadReport()">Export CSV</button></div><div class="empty">The export is generated from the current cloud dataset.</div></div>`}
function downloadReport(){const rows=[['Employee ID','Name','Department','Job','Salary','Status'],...state.employees.map(e=>[e.employee_id,e.full_name,e.department,e.job_title,e.salary,e.status])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='filter-city-employees.csv';a.click();URL.revokeObjectURL(a.href)}
function viewSettings(){if(role!=='ADMIN')return `<div class="section"><div class="empty">Admin only.</div></div>`;return `<div class="section"><div class="section-head"><b>Company Settings</b></div><div class="form-grid"><div class="field"><label>Company</label><input id="set_company" value="${esc(state.settings.company)}"></div><div class="field"><label>Working hours/day</label><input id="set_hours" type="number" step="0.5" value="${state.settings.hours}"></div><div class="field"><label>Annual leave days</label><input id="set_leave" type="number" value="${state.settings.annual_leave_days}"></div><div class="full"><button onclick="saveCompanySettings()">Save Settings to Cloud</button></div></div></div><div class="section"><div class="section-head"><b>Change Admin Password</b></div><div class="form-grid"><div class="field"><label>Current password</label><input id="current_password" type="password" autocomplete="current-password"></div><div class="field"><label>New password</label><input id="new_password" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label>Confirm new password</label><input id="confirm_password" type="password" minlength="8" autocomplete="new-password"></div><div class="full"><button onclick="changeAdminPassword()">Change Password</button></div></div></div>`}
async function saveCompanySettings(){await api('PUT','settings',{company:set_company.value,hours:set_hours.value,annual_leave_days:set_leave.value});toast('Settings saved to cloud');await refresh()}
async function changeAdminPassword(){if(new_password.value.length<8)return toast('New password must be at least 8 characters');if(new_password.value!==confirm_password.value)return toast('New passwords do not match');await api('POST','auth/change-password',{current_password:current_password.value,new_password:new_password.value});current_password.value='';new_password.value='';confirm_password.value='';toast('Admin password changed successfully')}
async function api(method,path,body){const r=await fetch(API+'/'+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem(tokenKey)},body:body?JSON.stringify(body):undefined});const text=await r.text();let d={};try{d=JSON.parse(text)}catch(_){throw Error(text||'Request failed')};if(!r.ok)throw Error(d.error||'Request failed');return d}
function showMsg(m){const x=document.getElementById('loginMsg');x.textContent=m;x.classList.remove('hidden')}function hideMsg(){document.getElementById('loginMsg').classList.add('hidden')}function toast(m){const x=document.getElementById('toast');x.textContent=m;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2500)}function closeMenu(){document.getElementById('sidebar').classList.remove('open')}function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}function logout(){localStorage.removeItem(tokenKey);sessionStorage.removeItem('fc_user');location.reload()}
(async()=>{const t=localStorage.getItem(tokenKey),u=JSON.parse(sessionStorage.getItem('fc_user')||'null');if(t&&u)await boot(u)})();
</script>
</body></html>
