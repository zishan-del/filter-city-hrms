name: Fix payroll allowances
on:
  push:
    branches: [feature/automatic-payroll]
    paths-ignore:
      - .github/workflows/fix-payroll-allowances.yml
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip payroll allowance fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/automatic-payroll
      - name: Patch payroll allowance sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/hrms.js')
          s=p.read_text()
          marker="await sql`CREATE TABLE IF NOT EXISTS payroll ("
          if "manual_override BOOLEAN NOT NULL DEFAULT FALSE" not in s:
              s=s.replace("    net_salary NUMERIC(14,2) DEFAULT 0,\n    created_at", "    net_salary NUMERIC(14,2) DEFAULT 0,\n    manual_override BOOLEAN NOT NULL DEFAULT FALSE,\n    created_at", 1)
              s=s.replace("  await sql`CREATE TABLE IF NOT EXISTS eosb_records", "  await sql`ALTER TABLE payroll ADD COLUMN IF NOT EXISTS manual_override BOOLEAN NOT NULL DEFAULT FALSE`;\n  await sql`CREATE TABLE IF NOT EXISTS eosb_records", 1)
          old="""    const existing = await sql`SELECT id FROM payroll WHERE employee_id=${e.employee_id} AND pay_month=${month} LIMIT 1`;
    if (existing.length) continue;
    const basic = Number(e.salary || 0);
    const allowances = Number(e.housing_allowance || 0) + Number(e.transport_allowance || 0) + Number(e.other_allowance || 0);
    await sql`INSERT INTO payroll(employee_id,pay_month,basic_salary,allowances,deductions,net_salary)
      VALUES(${e.employee_id},${month},${basic},${allowances},0,${basic+allowances})`;"""
          new="""    const existing = await sql`SELECT id,basic_salary,allowances,deductions,manual_override FROM payroll WHERE employee_id=${e.employee_id} AND pay_month=${month} LIMIT 1`;
    const basic = Number(e.salary || 0);
    const allowances = Number(e.housing_allowance || 0) + Number(e.transport_allowance || 0) + Number(e.other_allowance || 0);
    if (existing.length) {
      if (!existing[0].manual_override) {
        const deductions = Number(existing[0].deductions || 0);
        await sql`UPDATE payroll SET basic_salary=${basic},allowances=${allowances},net_salary=${basic+allowances-deductions} WHERE id=${existing[0].id}`;
      }
      continue;
    }
    await sql`INSERT INTO payroll(employee_id,pay_month,basic_salary,allowances,deductions,net_salary,manual_override)
      VALUES(${e.employee_id},${month},${basic},${allowances},0,${basic+allowances},FALSE)`;"""
          if old not in s: raise SystemExit('ensureCurrentPayroll block not found')
          s=s.replace(old,new,1)
          old2="""const row=await sql`UPDATE payroll SET basic_salary=${basic},allowances=${allowances},deductions=${deductions},net_salary=${basic+allowances-deductions} WHERE id=${id} RETURNING *`;
      if (!row.length) return send(res,404,{error:'Payroll record not found'});"""
          new2="""const row=await sql`UPDATE payroll SET basic_salary=${basic},allowances=${allowances},deductions=${deductions},net_salary=${basic+allowances-deductions},manual_override=TRUE WHERE id=${id} RETURNING *`;
      if (!row.length) return send(res,404,{error:'Payroll record not found'});"""
          if old2 not in s: raise SystemExit('payroll PUT block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/hrms.js
          git diff --cached --quiet || (git commit -m 'Fix payroll allowance sync [skip payroll allowance fix]' && git push origin HEAD:feature/automatic-payroll)