import java.util.Base64

plugins { id 'com.android.application' }

android { namespace 'com.filtercity.hrms'; compileSdk 35
    defaultConfig { applicationId 'com.filtercity.hrms'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0.0' }
}

tasks.register('generateLauncherIcon') {
    def outFile = file("$projectDir/src/main/res/drawable-nodpi/ic_launcher.jpg")
    inputs.file(file("$projectDir/icon.b64"))
    outputs.file(outFile)
    doLast {
        outFile.parentFile.mkdirs()
        def encoded = file("$projectDir/icon.b64").getText('UTF-8').replaceAll(/\s+/, '')
        outFile.bytes = Base64.decoder.decode(encoded)
    }
}

tasks.named('preBuild').configure { dependsOn('generateLauncherIcon') }
