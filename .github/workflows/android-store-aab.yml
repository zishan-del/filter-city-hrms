name: Build signed Play Store AAB

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate established upload-key secrets
        shell: bash
        run: |
          test -n "${{ secrets.FC_UPLOAD_KEYSTORE_B64 }}" || (echo "Missing FC_UPLOAD_KEYSTORE_B64" && exit 1)
          test -n "${{ secrets.FC_UPLOAD_STORE_PASSWORD }}" || (echo "Missing FC_UPLOAD_STORE_PASSWORD" && exit 1)
          test -n "${{ secrets.FC_UPLOAD_KEY_ALIAS }}" || (echo "Missing FC_UPLOAD_KEY_ALIAS" && exit 1)
          test -n "${{ secrets.FC_UPLOAD_KEY_PASSWORD }}" || (echo "Missing FC_UPLOAD_KEY_PASSWORD" && exit 1)
      - name: Restore established upload key
        shell: bash
        run: echo "${{ secrets.FC_UPLOAD_KEYSTORE_B64 }}" | base64 --decode > "$GITHUB_WORKSPACE/android/upload-key.jks"
      - name: Build signed release AAB
        working-directory: android
        env:
          FC_UPLOAD_KEYSTORE: ${{ github.workspace }}/android/upload-key.jks
          FC_UPLOAD_STORE_PASSWORD: ${{ secrets.FC_UPLOAD_STORE_PASSWORD }}
          FC_UPLOAD_KEY_ALIAS: ${{ secrets.FC_UPLOAD_KEY_ALIAS }}
          FC_UPLOAD_KEY_PASSWORD: ${{ secrets.FC_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease
      - name: Verify AAB exists and signature is valid
        shell: bash
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -certs android/app/build/outputs/bundle/release/app-release.aab >/dev/null
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: filter-city-hrms-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
