name: Add leave cycle tracking and admin password change
on:
  push:
    branches: [feature/leave-cycle-password]
    paths:
      - '.github/workflows/feature-leave-cycle-password.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch API and UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/hrms.js'); s=p.read_text()
          anchor="""  await sql`CREATE TABLE IF NOT EXISTS tasks ("""
          schema="""  await sql`ALTER TABLE employees ADD COLUMN IF NOT EXISTS leave_cycle_years NUMERIC(5,2) DEFAULT 2`;
          await sql`ALTER TABLE employees ADD COLUMN IF NOT EXISTS last_leave_end_date DATE`;
          await sql`ALTER TABLE employees ADD COLUMN IF NOT EXISTS next_leave_date DATE`;
          await sql`ALTER TABLE employees ADD COLUMN IF NOT EXISTS planned_leave_days NUMERIC(5,2) DEFAULT 30`;
          await sql`CREATE TABLE IF NOT EXISTS tasks ("""
          if anchor not in s: raise SystemExit('API schema anchor missing')
          s=s.replace(anchor,schema,1)
          old="""  const e = await sql`INSERT INTO employees(employee_id,full_name,mobile,national_id,nationality,joining_date,department,job_title,salary,bank_details,status)
    VALUES(${body.employee_id},${body.full_name},${body.mobile||''},${body.national_id||''},${body.nationality||'Saudi'},${body.joining_date||null},${body.department||''},${body.job_title||''},${Number(body.salary||0)},${body.bank_details||''},${body.status||'Active'}) RETURNING *`;"""
          new="""  const e = await sql`INSERT INTO employees(employee_id,full_name,mobile,national_id,nationality,joining_date,department,job_title,salary,bank_details,status,leave_cycle_years,last_leave_end_date,next_leave_date,planned_leave_days)
    VALUES(${body.employee_id},${body.full_name},${body.mobile||''},${body.national_id||''},${body.nationality||'Saudi'},${body.joining_date||null},${body.department||''},${body.job_title||''},${Number(body.salary||0)},${body.bank_details||''},${body.status||'Active'},${Number(body.leave_cycle_years||2)},${body.last_leave_end_date||null},${body.next_leave_date||null},${Number(body.planned_leave_days||30)}) RETURNING *`;"""
          if old not in s: raise SystemExit('API createEmployee anchor missing')
          s=s.replace(old,new,1)
          old="""  const e = await sql`UPDATE employees SET full_name=${body.full_name},mobile=${body.mobile||''},national_id=${body.national_id||''},nationality=${body.nationality||'Saudi'},joining_date=${body.joining_date||null},department=${body.department||''},job_title=${body.job_title||''},salary=${Number(body.salary||0)},bank_details=${body.bank_details||''},status=${body.status||'Active'} WHERE id=${id} RETURNING *`;"""
          new="""  const e = await sql`UPDATE employees SET full_name=${body.full_name},mobile=${body.mobile||''},national_id=${body.national_id||''},nationality=${body.nationality||'Saudi'},joining_date=${body.joining_date||null},department=${body.department||''},job_title=${body.job_title||''},salary=${Number(body.salary||0)},bank_details=${body.bank_details||''},status=${body.status||'Active'},leave_cycle_years=${Number(body.leave_cycle_years||2)},last_leave_end_date=${body.last_leave_end_date||null},next_leave_date=${body.next_leave_date||null},planned_leave_days=${Number(body.planned_leave_days||30)} WHERE id=${id} RETURNING *`;"""
          if old not in s: raise SystemExit('API updateEmployee anchor missing')
          s=s.replace(old,new,1)
          anchor="""  if (req.method === 'POST' && path === 'auth/login') return login(req, res);"""
          change="""  if (req.method === 'POST' && path === 'auth/login') return login(req, res);
          if (req.method === 'POST' && path === 'auth/change-password') {
            const user = auth(req); if (!user) return send(res,401,{error:'Unauthorized'});
            const body = await getBody(req); const currentPassword=String(body.current_password||''); const newPassword=String(body.new_password||'');
            if(newPassword.length<8) return send(res,400,{error:'New password must be at least 8 characters'});
            const rows=await sql`SELECT id,password_hash FROM users WHERE id=${Number(user.id)} LIMIT 1`;
            if(!rows.length || rows[0].password_hash!==hash(currentPassword)) return send(res,400,{error:'Current password is incorrect'});
            await sql`UPDATE users SET password_hash=${hash(newPassword)} WHERE id=${Number(user.id)}`; return send(res,200,{ok:true});
          }"""
          if anchor not in s: raise SystemExit('API password anchor missing')
          s=s.replace(anchor,change,1); p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          old="""<div class=\"field\"><label>Status</label><select id=\"status\"><option ${e.status==='Active'?'selected':''}>Active</option><option ${e.status==='Inactive'?'selected':''}>Inactive</option></select></div><div class=\"field\"><label>Login username</label>"""
          new="""<div class=\"field\"><label>Status</label><select id=\"status\"><option ${e.status==='Active'?'selected':''}>Active</option><option ${e.status==='Inactive'?'selected':''}>Inactive</option></select></div><div class=\"field\"><label>Leave cycle (years)</label><input id=\"leave_cycle_years\" type=\"number\" step=\"0.5\" min=\"1\" value=\"${e.leave_cycle_years||2}\"></div><div class=\"field\"><label>Last leave end date</label><input id=\"last_leave_end_date\" type=\"date\" value=\"${esc(String(e.last_leave_end_date||'').slice(0,10))}\"></div><div class=\"field\"><label>Next leave date</label><input id=\"next_leave_date\" type=\"date\" value=\"${esc(String(e.next_leave_date||'').slice(0,10))}\"></div><div class=\"field\"><label>Planned leave days (30–60)</label><input id=\"planned_leave_days\" type=\"number\" min=\"30\" max=\"60\" step=\"1\" value=\"${e.planned_leave_days||30}\"></div><div class=\"field\"><label>Login username</label>"""
          if old not in s: raise SystemExit('UI employee fields anchor missing')
          s=s.replace(old,new,1)
          old="""status:status.value,username:emp_username.value,password:emp_password.value};"""
          new="""status:status.value,leave_cycle_years:leave_cycle_years.value,last_leave_end_date:last_leave_end_date.value||null,next_leave_date:next_leave_date.value||null,planned_leave_days:planned_leave_days.value,username:emp_username.value,password:emp_password.value};"""
          if old not in s: raise SystemExit('UI save employee anchor missing')
          s=s.replace(old,new,1)
          start=s.index('function viewLeave(){'); end=s.index('function viewHolidays(){',start)
          leave="""function viewLeave(){const me=JSON.parse(sessionStorage.getItem('fc_user'));const rows=role==='EMPLOYEE'?state.leaves.filter(l=>l.employee_id===me.employeeId):state.leaves;const upcoming=role==='ADMIN'?state.employees.filter(e=>e.next_leave_date&&e.status==='Active').sort((a,b)=>String(a.next_leave_date).localeCompare(String(b.next_leave_date))):[];return `${role==='ADMIN'?`<div class=\"section\"><div class=\"section-head\"><b>Upcoming Employee Leave</b><span class=\"badge\">30–60 days every 2 years</span></div><div class=\"table-wrap\"><table class=\"table\"><thead><tr><th>Employee</th><th>Name</th><th>Next Leave</th><th>Planned Days</th><th>Cycle</th><th>Last Leave End</th><th>Days Until</th></tr></thead><tbody>${upcoming.map(e=>{const d=Math.ceil((new Date(String(e.next_leave_date).slice(0,10)+'T00:00:00')-new Date(new Date().toISOString().slice(0,10)+'T00:00:00'))/86400000);return `<tr><td>${esc(e.employee_id)}</td><td>${esc(e.full_name)}</td><td>${esc(String(e.next_leave_date).slice(0,10))}</td><td>${esc(e.planned_leave_days||30)}</td><td>${esc(e.leave_cycle_years||2)} years</td><td>${esc(String(e.last_leave_end_date||'').slice(0,10)||'—')}</td><td><span class=\"badge\">${d<0?'Overdue':d+' days'}</span></td></tr>`}).join('')||'<tr><td colspan=\"7\" class=\"empty\">No upcoming leave dates entered. Edit an employee to add the next leave date.</td></tr>'}</tbody></table></div></div>`:''}<div class=\"section\"><div class=\"section-head\"><b>Leave Requests</b><button onclick=\"leaveForm()\">+ Leave Request</button></div><div class=\"table-wrap\"><table class=\"table\"><thead><tr><th>Employee</th><th>Type</th><th>Start</th><th>End</th><th>Days</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(l=>`<tr><td>${esc(l.employee_id)}</td><td>${esc(l.leave_type)}</td><td>${esc(String(l.start_date).slice(0,10))}</td><td>${esc(String(l.end_date).slice(0,10))}</td><td>${esc(l.days)}</td><td>${esc(l.status)}</td><td>${role==='ADMIN'&&l.status==='Pending'?`<button onclick=\"decideLeave(${l.id},'Approved')\">Approve</button> <button class=\"danger\" onclick=\"decideLeave(${l.id},'Rejected')\">Reject</button>`:''}</td></tr>`).join('')||'<tr><td colspan=\"7\" class=\"empty\">No leave requests.</td></tr>'}</tbody></table></div></div>`}
"""
          s=s[:start]+leave+s[end:]
          start=s.index('function viewSettings(){'); end=s.index('async function saveSettings()',start)
          settings="""function viewSettings(){if(role!=='ADMIN')return `<div class=\"section\"><div class=\"empty\">Admin only.</div></div>`;return `<div class=\"section\"><div class=\"section-head\"><b>Company Settings</b></div><div class=\"form-grid\"><div class=\"field\"><label>Company</label><input id=\"set_company\" value=\"${esc(state.settings.company)}\"></div><div class=\"field\"><label>Working hours/day</label><input id=\"set_hours\" type=\"number\" step=\"0.5\" value=\"${state.settings.hours}\"></div><div class=\"field\"><label>Annual leave days</label><input id=\"set_leave\" type=\"number\" value=\"${state.settings.annual_leave_days}\"></div><div class=\"full\"><button onclick=\"saveSettings()\">Save Settings to Cloud</button></div></div></div><div class=\"section\"><div class=\"section-head\"><b>Change Admin Password</b></div><div class=\"form-grid\"><div class=\"field\"><label>Current password</label><input id=\"current_password\" type=\"password\"></div><div class=\"field\"><label>New password</label><input id=\"new_password\" type=\"password\" minlength=\"8\"></div><div class=\"field\"><label>Confirm new password</label><input id=\"confirm_password\" type=\"password\" minlength=\"8\"></div><div class=\"full\"><button onclick=\"changeAdminPassword()\">Change Password</button></div></div></div>`}
          async function changeAdminPassword(){if(new_password.value!==confirm_password.value)return toast('New passwords do not match');await api('POST','auth/change-password',{current_password:current_password.value,new_password:new_password.value});current_password.value='';new_password.value='';confirm_password.value='';toast('Admin password changed successfully')}
          """
          s=s[:start]+settings+s[end:]; p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/hrms.js index.html; git commit -m 'Add two-year leave tracking and admin password change'; git push
