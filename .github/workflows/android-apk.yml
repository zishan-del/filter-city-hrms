name: Build FILTER CITY HRMS APK

on:
  push:
    branches: [app-build, release-final-2026-09-03, store-release-prep-2026-09-03, fix-native-notifications-2026-09-05]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test APK launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash -lc 'set -e; adb install -r android/app/build/outputs/apk/debug/app-debug.apk; adb logcat -c; adb shell am start -W -n com.filtercity.hrms/com.google.androidbrowserhelper.trusted.LauncherActivity | tee launch-result.txt; grep -q "Status: ok" launch-result.txt; sleep 6; adb logcat -d > launch-log.txt; if grep -Fq "FATAL EXCEPTION" launch-log.txt && grep -Fq "Process: com.filtercity.hrms" launch-log.txt; then echo "FILTER CITY HRMS crashed during launch"; grep -A 30 -B 5 "Process: com.filtercity.hrms" launch-log.txt || true; exit 1; fi; echo "APK startup smoke test passed"'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: filter-city-hrms-native-notifications-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
