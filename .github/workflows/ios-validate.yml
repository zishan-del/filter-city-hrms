name: Validate FILTER CITY HRMS iOS

on:
  push:
    branches: [store-release-prep-2026-09-03]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-validate.yml'
  workflow_dispatch:

jobs:
  validate-ios:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for iOS Simulator without signing
        working-directory: ios
        run: xcodebuild -project FILTERCITYHRMS.xcodeproj -scheme FILTERCITYHRMS -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
