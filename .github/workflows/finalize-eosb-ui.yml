name: Finalize EOSB UI
on:
  push:
    branches: [feature/automatic-payroll]
    paths-ignore:
      - .github/workflows/finalize-eosb-ui.yml
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip eosb ui]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/automatic-payroll
          fetch-depth: 1
      - name: Patch UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* FINAL SAUDI EOSB UI v1 */'
          if marker in s:
            raise SystemExit(0)
          inject=r'''<script>
          /* FINAL SAUDI EOSB UI v1 */
          function eosbCalc(){
            const e=state.employees.find(x=>x.employee_id===document.getElementById('eosb_employee')?.value);
            const salary=Number(document.getElementById('eosb_salary')?.value||0);
            const years=Number(document.getElementById('eosb_years')?.value||0);
            const months=Number(document.getElementById('eosb_months')?.value||0);
            const days=Number(document.getElementById('eosb_days')?.value||0);
            const total=Math.max(0,years+months/12+days/360);
            let award=salary*(Math.min(total,5)*0.5+Math.max(total-5,0));
            const reason=String(document.getElementById('eosb_reason')?.value||'Contract ended').toLowerCase();
            if(reason.includes('resign')){if(total<2)award=0;else if(total<5)award/=3;else if(total<10)award*=2/3}
            const out=document.getElementById('eosb_result');
            if(out)out.innerHTML=`<b>Saudi EOSB: SAR ${award.toFixed(2)}</b><div class="muted" style="margin-top:6px">Last wage: SAR ${salary.toFixed(2)} · Service: ${total.toFixed(3)} years</div>`;
            return {e,salary,years,months,days,total,award};
          }
          function viewEOSB(){
            const rows=state.eosb.map(x=>{const e=state.employees.find(a=>a.employee_id===x.employee_id);return `<tr><td>${esc(e?.full_name||x.employee_id)}</td><td>${Number(x.last_salary||0).toFixed(2)}</td><td>${Number(x.service_years||0).toFixed(2)}</td><td>${esc(x.termination_reason||'Contract ended')}</td><td><b>${Number(x.benefit||0).toFixed(2)}</b></td></tr>`}).join('');
            return `<div class="hero"><h1>End of Service Benefit</h1><div>Saudi Labor Law formula: half-month wage for each of the first 5 years, then one full month wage for each following year. Partial years are proportional.</div></div><div class="section"><div class="section-head"><b>Calculate EOSB</b></div><div class="form-grid"><div class="field"><label>Employee</label><select id="eosb_employee" onchange="eosbSelectEmployee()"><option value="">Select employee</option>${state.employees.filter(e=>e.status==='Active').map(e=>`<option value="${esc(e.employee_id)}">${esc(e.full_name)} (${esc(e.employee_id)})</option>`).join('')}</select></div><div class="field"><label>Last wage (SAR)</label><input id="eosb_salary" type="number" step="0.01" oninput="eosbCalc()" value="0"></div><div class="field"><label>Termination reason</label><select id="eosb_reason" onchange="eosbCalc()"><option>Contract ended</option><option>Employer termination</option><option>Resignation</option><option>Force majeure</option><option>Other</option></select></div><div class="field"><label>Service years</label><input id="eosb_years" type="number" min="0" step="1" value="0" oninput="eosbCalc()"></div><div class="field"><label>Service months</label><input id="eosb_months" type="number" min="0" max="11" step="1" value="0" oninput="eosbCalc()"></div><div class="field"><label>Service days</label><input id="eosb_days" type="number" min="0" max="29" step="1" value="0" oninput="eosbCalc()"></div><div class="field full"><div id="eosb_result" class="card">Enter service period to calculate.</div></div><div class="field full"><button onclick="saveEOSBFinal()">Save EOSB Record</button></div></div></div><div class="section"><div class="section-head"><b>Saved EOSB Records</b></div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Last Wage</th><th>Service Years</th><th>Reason</th><th>Benefit</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">No EOSB records yet.</td></tr>'}</tbody></table></div></div>`;
          }
          function eosbSelectEmployee(){
            const id=document.getElementById('eosb_employee').value;const e=state.employees.find(x=>x.employee_id===id);if(!e)return;
            document.getElementById('eosb_salary').value=(Number(e.salary||0)+Number(e.housing_allowance||0)+Number(e.transport_allowance||0)+Number(e.other_allowance||0)).toFixed(2);
            if(e.joining_date){const start=new Date(String(e.joining_date).slice(0,10));const now=new Date();let years=now.getFullYear()-start.getFullYear();let months=now.getMonth()-start.getMonth();let days=now.getDate()-start.getDate();if(days<0){months--;days+=30}if(months<0){years--;months+=12}years=Math.max(0,years);document.getElementById('eosb_years').value=years;document.getElementById('eosb_months').value=Math.max(0,months);document.getElementById('eosb_days').value=Math.max(0,days)}eosbCalc();
          }
          async function saveEOSBFinal(){
            const c=eosbCalc();if(!c.e)return toast('Select an employee');
            const r=await fetch(API+'/eosb',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem(tokenKey)},body:JSON.stringify({employee_id:c.e.employee_id,last_salary:c.salary,service_years:c.years,service_months:c.months,service_days:c.days,termination_reason:document.getElementById('eosb_reason').value})});
            const d=await r.json();if(!r.ok)return toast(d.error||'Unable to save EOSB');toast('EOSB saved');await refresh();
          }
          </script>'''
          s=s.replace('</body>',inject+'\n</body>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Add Saudi EOSB calculator UI [skip eosb ui]' && git push origin HEAD:feature/automatic-payroll)